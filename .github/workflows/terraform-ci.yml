name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".tflint.hcl"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Check formatting
        id: fmt
        run: terraform fmt -check -recursive -diff

      - name: Write summary
        if: always()
        run: |
          if [ "${{ steps.fmt.outcome }}" = "success" ]; then
            echo "### ✅ terraform fmt — all files formatted correctly" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ terraform fmt — formatting issues found" >> "$GITHUB_STEP_SUMMARY"
            echo 'Run `terraform fmt -recursive` locally and commit the result.' >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        id: validate
        run: terraform validate -no-color

      - name: Write summary
        if: always()
        run: |
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            echo "### ✅ terraform validate — configuration is valid" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ terraform validate — configuration errors found, see job logs" >> "$GITHUB_STEP_SUMMARY"
          fi

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        id: tflint
        # Blocking: the pre-existing backlog (9 module version-constraint
        # findings + 1 unused variable) was triaged and fixed, so this is
        # now held to zero findings going forward.
        run: tflint -f compact --recursive

      - name: Write summary
        if: always()
        run: |
          if [ "${{ steps.tflint.outcome }}" = "success" ]; then
            echo "### ✅ tflint — no issues found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ tflint — issues found, see job logs" >> "$GITHUB_STEP_SUMMARY"
          fi

  security-scan:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        id: checkov
        # Advisory for now, same reasoning as tflint above: this is a small
        # demo/learning template with intentionally simplified resources, so
        # some findings are expected and reviewed manually rather than
        # blocking every PR.
        continue-on-error: true
        run: checkov -d . --framework terraform --compact --quiet

      - name: Write summary
        if: always()
        run: |
          if [ "${{ steps.checkov.outcome }}" = "success" ]; then
            echo "### ✅ checkov — no findings" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ checkov — findings reported (advisory, non-blocking), see job logs" >> "$GITHUB_STEP_SUMMARY"
          fi

  report:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [fmt, validate, tflint, security-scan]
    if: always()
    steps:
      - name: Aggregate report
        run: |
          echo "## Terraform CI Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result | Blocking |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| terraform fmt | ${{ needs.fmt.result }} | yes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| terraform validate | ${{ needs.validate.result }} | yes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| tflint | ${{ needs.tflint.result }} | yes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| checkov | ${{ needs.security-scan.result }} | no (advisory) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on blocking checks
        if: needs.fmt.result == 'failure' || needs.validate.result == 'failure' || needs.tflint.result == 'failure'
        run: exit 1
